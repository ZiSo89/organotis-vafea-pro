  <!-- Google Maps -->
  <script>
    // Dummy callback to prevent errors
    window.initMap = function() {};
    
    // Load Google Maps on demand (only when needed)
    let googleMapsPromise = null; // Track loading state
    
    window.loadGoogleMaps = function() {
      // Return existing promise if already loading or loaded
      if (googleMapsPromise) {
        return googleMapsPromise;
      }
      
      googleMapsPromise = new Promise((resolve, reject) => {
        // Check if already loaded
        if (typeof google !== 'undefined' && google.maps) {
          resolve();
          return;
        }
        
        // Check if script is already being loaded
        const existingScript = document.querySelector('script[src*="maps.googleapis.com"]');
        if (existingScript) {
          // Wait for existing script to load
          existingScript.addEventListener('load', () => resolve());
          existingScript.addEventListener('error', () => reject('Failed to load'));
          return;
        }
        
        const script = document.createElement('script');
        script.src = 'https://maps.googleapis.com/maps/api/js?key=AIzaSyDbO_6f6Y_y_2_2MreK0XTWAIsZw-2AKWQ&libraries=geometry,places&callback=initMap';
        script.async = true;
        script.onload = () => resolve();
        script.onerror = () => {
          googleMapsPromise = null; // Reset promise on error
          reject('Failed to load');
        };
        document.head.appendChild(script);
      });
      
      return googleMapsPromise;
    };
  </script>
  
  <!-- Leaflet Maps (Fallback) - Loaded conditionally via JavaScript -->
  
  <script>
    // Nominatim Geocoding Helper - Uses backend PHP proxy (Web) or direct API (Electron)
    const Geocoding = {
      lastRequestTime: 0,
      
      async getCoordinates(address, city = 'Αλεξανδρούπολη', country = 'Ελλάδα') {
        try {
          const query = `${address}, ${city}, ${country}`;
          const isElectron = typeof window.electronAPI !== 'undefined';
          
          if (isElectron) {
            // Electron: Direct Nominatim API call
            // Rate limiting: 1 request per second
            const now = Date.now();
            const timeSinceLastRequest = now - this.lastRequestTime;
            if (timeSinceLastRequest < 1000) {
              await new Promise(resolve => setTimeout(resolve, 1000 - timeSinceLastRequest));
            }
            this.lastRequestTime = Date.now();
            
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`;
            const response = await fetch(url, {
              headers: {
                'User-Agent': 'NikolPaintMaster/1.0'
              }
            });
            
            if (!response.ok) {
              console.warn('Nominatim API failed:', response.status);
              return null;
            }
            
            const result = await response.json();
            
            if (result && result.length > 0) {
              return {
                lat: parseFloat(result[0].lat),
                lng: parseFloat(result[0].lon)
              };
            }
          } else {
            // Web: Use backend PHP proxy to avoid CORS issues
            const url = `/api/geocode.php?address=${encodeURIComponent(query)}`;
            const response = await fetch(url);
            
            if (!response.ok) {
              console.warn('Geocoding API failed:', response.status);
              return null;
            }
            
            const result = await response.json();
            
            if (result.success && result.data && result.data.length > 0) {
              return {
                lat: parseFloat(result.data[0].lat),
                lng: parseFloat(result.data[0].lon)
              };
            }
          }
          
          return null;
        } catch (error) {
          console.error('Geocoding error:', error);
          return null;
        }
      }
    };
  </script>
